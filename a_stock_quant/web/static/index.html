<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-Stock Quant Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
       background: #0f1117; color: #e1e4e8; min-height: 100vh; }
.header { background: #161b22; border-bottom: 1px solid #30363d;
          padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 600; color: #58a6ff; }
.status { display: flex; gap: 16px; font-size: 13px; color: #8b949e; }
.status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.status .dot.on { background: #3fb950; }
.status .dot.off { background: #f85149; }
.main { display: grid; grid-template-columns: 1fr 360px; gap: 20px; padding: 20px 24px; max-height: calc(100vh - 60px); }
.panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
.panel-header { padding: 12px 16px; border-bottom: 1px solid #30363d; font-size: 14px; font-weight: 600; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 12px; color: #8b949e; font-weight: 500; border-bottom: 1px solid #30363d;
     position: sticky; top: 0; background: #161b22; }
td { padding: 8px 12px; border-bottom: 1px solid #21262d; }
tr:hover { background: #1c2129; cursor: pointer; }
tr.selected { background: #1a2a3a; }
.up { color: #f85149; }   /* red for up (Chinese convention) */
.down { color: #3fb950; } /* green for down */
.chart-container { height: 260px; padding: 12px; }
.add-stock { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #30363d; }
.add-stock input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
                   padding: 6px 12px; color: #e1e4e8; font-size: 13px; outline: none; }
.add-stock input:focus { border-color: #58a6ff; }
.add-stock button { background: #238636; border: none; border-radius: 6px; padding: 6px 16px;
                    color: #fff; font-size: 13px; cursor: pointer; }
.add-stock button:hover { background: #2ea043; }
.remove-btn { background: #f8514920; border: 1px solid #f8514940; border-radius: 4px;
              color: #f85149; padding: 3px 10px; font-size: 11px; cursor: pointer;
              font-weight: 600; transition: all 0.15s; }
.remove-btn:hover { background: #f85149; color: #fff; border-color: #f85149; }
.alerts-list { max-height: calc(100vh - 340px); overflow-y: auto; padding: 0; }
.alert-item { padding: 10px 16px; border-bottom: 1px solid #21262d; font-size: 12px; }
.alert-item.info { border-left: 3px solid #58a6ff; }
.alert-item.warning { border-left: 3px solid #d29922; }
.alert-item.critical { border-left: 3px solid #f85149; }
.alert-time { color: #484f58; margin-right: 8px; }
.alert-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px;
               font-weight: 600; margin-right: 6px; text-transform: uppercase; }
.alert-badge.info { background: #58a6ff22; color: #58a6ff; }
.alert-badge.warning { background: #d2992222; color: #d29922; }
.alert-badge.critical { background: #f8514922; color: #f85149; }
.empty { padding: 24px; text-align: center; color: #484f58; font-size: 13px; }
.flash { animation: flash 0.6s ease-out; }
@keyframes flash { from { background: #30363d; } to { background: transparent; } }
.toast-container { position: fixed; top: 12px; right: 12px; z-index: 1000; display: flex;
                   flex-direction: column; gap: 8px; }
.toast { padding: 10px 16px; border-radius: 6px; font-size: 13px; color: #fff;
         animation: slideIn 0.3s ease-out; max-width: 360px; }
.toast.warning { background: #d29922; }
.toast.critical { background: #f85149; }
.toast.info { background: #1f6feb; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; }
                     to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>
<div class="header">
  <h1>A-Stock Quant Monitor</h1>
  <div class="status">
    <span><span class="dot on" id="ws-dot"></span>Live</span>
    <span id="poll-count">Polls: 0</span>
    <span id="market-status">--</span>
  </div>
</div>
<div class="toast-container" id="toasts"></div>
<div class="main">
  <div class="panel">
    <div class="panel-header">Watchlist</div>
    <div class="add-stock">
      <input type="text" id="stock-input" placeholder="Add stock (code or name, e.g. 600519 or 贵州茅台)" />
      <button onclick="addStock()">+ Add</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Code</th><th>Name</th><th>Price</th><th>Chg%</th>
            <th>Open</th><th>High</th><th>Low</th>
            <th>PE(TTM)</th><th>PB</th><th>Turnover%</th>
            <th>MktCap(亿)</th><th></th>
          </tr>
        </thead>
        <tbody id="watchlist-body">
          <tr><td colspan="12" class="empty">No stocks added. Use the input above or config.yaml.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="panel-header">Price Chart</div>
    <div class="chart-container">
      <canvas id="price-chart"></canvas>
    </div>
  </div>
  <div class="panel">
    <div class="panel-header">Recent Alerts</div>
    <div class="alerts-list" id="alerts-list">
      <div class="empty">No alerts yet</div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
