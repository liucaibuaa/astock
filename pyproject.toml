[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a-stock-quant"
version = "0.1.0"
description = "Real-time A-stock monitoring system with alerts and web dashboard"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.0",
    "stockstats>=0.6.5",
    "pandas>=2.0",
    "mootdx>=0.10.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
holiday = ["akshare>=1.18.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
astock = "a_stock_quant.cli.main:app"

[tool.setuptools.packages.find]
include = ["a_stock_quant*"]
